<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Timer</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        #timer { font-size: 5rem; font-weight: bold; color: #007BFF; margin: 20px; }
        button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; border: none; background-color: #28a745; color: white; }
    </style>
</head>
<body>
    <h1>Flask Countdown Timer</h1>
    <div id="timer">00:00</div>
    <button onclick="startTimer()">Start</button>

    <script>
        const startingSeconds = parseInt("{{ seconds }}") || 120;
        let timeLeft = startingSeconds;

        window.onload = function() { updateDisplay(); };

        function startTimer() {
            setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                }
            }, 1000);
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
    </script>
</body>
</html>
